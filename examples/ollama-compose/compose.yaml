# Local AI stack: Ollama (the brain) + Open WebUI (the chat screen).
# From Chapter 5 of "Docker in Plain English" — Asdale Dynamics, LLC.
#
# Put this file in its own folder, then:
#   docker compose up -d          # start
#   docker compose logs --tail 20 # watch it settle
#   docker compose pull && docker compose up -d   # later: update, data kept
#   docker compose down           # stop, keep data
#   docker compose down --volumes # stop and delete data (means it!)
#
# Open http://localhost:3000 after it's up. First visit: create a local
# account (stays inside your container). Then pull a small model:
#   docker exec ollama ollama pull llama3.2:1b
#
# All local, all free, no API keys, no accounts outside your machine.

services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    volumes:
      - open-webui-data:/app/backend/data
    ports:
      - "3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama-models:
  open-webui-data:
